            { id: 33, topic: "Chủ đề 1: Lịch sử và Sử học", q: "Trong quá trình tìm hiểu, nghiên cứu lịch sử, việc xác minh, đánh giá nguồn sử liệu là một khâu quan trọng nhằm mục đích nào sau đây?", options: ["A. Xác định danh sách các nguồn sử liệu cần thu thập.", "B. Xác định độ tin cậy và giá trị của các nguồn sử liệu.", "C. Ghi chép thông tin liên quan đến vấn đề nghiên cứu.", "D. Chọn lọc và phân loại các nguồn sử liệu phù hợp."], answer: 1 },
            { id: 34, topic: "Chủ đề 1: Lịch sử và Sử học", q: "Nội dung nào sau đây không phải là hình thức để học tập, khám phá lịch sử?", options: ["A. Tham quan các bảo tàng.", "B. Xem các phim lịch sử.", "C. Khám phá các đại dương.", "D. Tham quan khu lưu niệm."], answer: 2 },
            { id: 35, topic: "Chủ đề 1: Lịch sử và Sử học", q: "Nội dung nào sau đây phản ánh đúng mối liên hệ giữa kiến thức lịch sử với cuộc sống hiện tại?", options: ["A. Lịch sử giúp con người hiểu rõ hơn những vấn đề thời sự trong nước và quốc tế.", "B. Kiến thức lịch sử giúp con người thay đổi được quá khứ để hướng tới tương lai.", "C. Kiến thức lịch sử là yếu tố quyết định thành công của con người trong công việc.", "D. Lịch sử là nhân tố quyết định sự phát triển khoa học kĩ thuật của một quốc gia."], answer: 0 },

            // BÀI 3 (36 - 66)
            { id: 36, topic: "Bài 3: Vai trò của Sử học", q: "Di sản văn hóa là một bộ phận quan trọng của", options: ["A. toán học.", "B. lịch sử.", "C. công nghệ.", "D. kĩ thuật."], answer: 1 },
            { id: 37, topic: "Bài 3: Vai trò của Sử học", q: "Di sản văn hoá là những sản phẩm tinh thần, vật chất, được lưu truyền từ thế hệ này sang thế hệ khác, có giá trị", options: ["A. lịch sử, văn hoá", "B. kinh tế, chính trị.", "C. luật pháp, văn hoá.", "D. khoa học, công nghệ."], answer: 0 },
            { id: 38, topic: "Bài 3: Vai trò của Sử học", q: "Ngành khoa học nào sau đây góp phần quan trọng trong bảo tồn và phát huy những giá trị của di sản văn hóa phi vật thể?", options: ["A. Sinh vật học.", "B. Sử học.", "C. Y học.", "D. Giải phẫu học."], answer: 1 },
            { id: 39, topic: "Bài 3: Vai trò của Sử học", q: "Nội dung nào sau đây không phải là biểu hiện về mối quan hệ giữa Sử học với di sản văn hóa, di sản thiên nhiên?", options: ["A. Sử học quyết định sự tồn tại của tất cả các di sản.", "B. Di sản là nguồn sử liệu cho nghiên cứu lịch sử.", "C. Sử học góp phần quảng bá hình ảnh di sản tới cộng đồng.", "D. Sử học góp phần xác định đúng các giá trị của mỗi di sản."], answer: 0 },
            { id: 40, topic: "Bài 3: Vai trò của Sử học", q: "Các loại hình di sản văn hóa có ý nghĩa nào sau đây đối với lĩnh vực Sử học?", options: ["A. Quyết định nhất đối với sự tồn tại và phát triển của Sử học.", "B. Quyết định chính sách của Nhà nước đối với khoa học lịch sử.", "C. Là nguồn tư liệu và cơ sở để nghiên cứu, tái hiện lại lịch sử.", "D. Là nguồn sử liệu phi chính thống trong nghiên cứu lịch sử."], answer: 2 },
            { id: 41, topic: "Bài 3: Vai trò của Sử học", q: "Nội dung nào sau đây phản ánh đúng vai trò của các loại hình di sản văn hoá đối với nghiên cứu lịch sử?", options: ["A. Là nguồn sử liệu duy nhất để tái hiện lại lịch sử.", "B. Là nguồn sử liệu phi chính thống để tham khảo.", "C. Là nguồn sử liệu thành văn có giá trị khoa học cao.", "D. Là nguồn sử liệu quan trọng để nghiên cứu lịch sử."], answer: 3 },
            { id: 42, topic: "Bài 3: Vai trò của Sử học", q: "Nội dung nào sau đây là biểu hiện về mối quan hệ giữa Sử học với di sản văn hóa, di sản thiên nhiên?", options: ["A. Sử học quyết định sự tồn tại của tất cả các di sản văn hóa.", "B. Di sản là nguồn sử liệu thành văn cho nghiên cứu lịch sử.", "C. Nghiên cứu Sử học tạo cơ sở khoa học cho bảo tồn di sản.", "D. Di sản quyết định trực tiếp sự tồn tại của khoa học lịch sử."], answer: 2 },
            { id: 43, topic: "Bài 3: Vai trò của Sử học", q: "Giá trị lịch sử của di sản được giữ gìn thông qua việc", options: ["A. kiểm kê.", "B. bảo tồn.", "C. xây dựng.", "D. làm mới."], answer: 1 },
            { id: 44, topic: "Bài 3: Vai trò của Sử học", q: "Nội dung nào sao đây không phải là vai trò của Sử học đối với việc bảo tồn, phát huy giá trị di sản văn hóa, di sản thiên nhiên?", options: ["A. Sử học nghiên cứu quá trình hình thành, phát triển của di sản.", "B. Sử học giúp xác định đúng vị trí, vai trò và ý nghĩa của di sản.", "C. Sử học cung cấp thông tin phục vụ việc bảo tồn, phát huy di sản.", "D. Sử học trực tiếp quyết định chính sách bảo tồn, phát huy di sản."], answer: 3 },
            { id: 45, topic: "Bài 3: Vai trò của Sử học", q: "Điều cốt lõi trong hoạt động bảo tồn di sản văn hóa là phải đảm bảo tính", options: ["A. kế thừa.", "B. nguyên trạng.", "C. tái tạo.", "D. nhân tạo."], answer: 1 },
            { id: 46, topic: "Bài 3: Vai trò của Sử học", q: "Phát huy giá trị di sản là", options: ["A. Giữ nguyên dạng giá trị của di sản như ban đầu.", "B. Giữ gìn sự tồn tại của di sản theo dạng thức vốn có.", "C. Sử dụng hiệu quả giá trị của di sản trong đời sống.", "D. Khắc phục tác động xấu từ bên ngoài lên di sản."], answer: 2 },
            { id: 47, topic: "Bài 3: Vai trò của Sử học", q: "Cơ sở khoa học cho công tác xác định giá trị, bảo tồn và phát huy giá trị đích thực của di sản là kết quả nghiên cứu của", options: ["A. Sử học.", "B. Địa lí.", "C. Văn học.", "D. Toán học."], answer: 0 },
            { id: 48, topic: "Bài 3: Vai trò của Sử học", q: "Bảo tồn và phát huy giá trị các di sản văn hoá không phải là hoạt động", options: ["A. tiến hành xây mới các di tích, hiện đại hoá di tích.", "B. đảm bảo sự phát triển bền vững của quốc gia, dân tộc.", "C. đem lại hiệu quả thiết thực phát triển kinh tế, xã hội.", "D. hình thành ý thức trách nhiệm với cộng đồng, xã hội."], answer: 0 },
            { id: 49, topic: "Bài 3: Vai trò của Sử học", q: "Nội dung nào sau đây phản ánh không đúng vai trò của công tác bảo tồn và phát huy giá trị di sản văn hoá, di sản thiên nhiên?", options: ["A. Là cách duy nhất để quảng bá lịch sử, văn hóa của đất nước ra bên ngoài.", "B. Góp phần khắc phục những tác động tiêu cực của tự nhiên đối với di sản.", "C. Góp phần gìn giữ và lưu truyền di sản văn hoá phi vật thể cho thế hệ sau.", "D. Giáo dục con người nhớ về cội nguồn và trách nhiệm với tổ tiên, cộng đồng."], answer: 0 },
            { id: 50, topic: "Bài 3: Vai trò của Sử học", q: "Nội dung nào sau đây phản ánh đúng vai trò của công tác bảo tồn các di sản văn hóa phi vật thể?", options: ["A. Góp phần khắc phục những tác động tiêu cực của tự nhiên đối với di sản.", "B. Giúp giữ gìn và lưu truyền giá trị của di sản từ thế hệ này sang thế hệ khác.", "C. Góp phần ngăn chặn tình trạng xuống cấp, biến dạng và hư hỏng của di sản.", "D. Tạo nhấn tố quyết định cho sự phát triển của kinh tế, xã hội của địa phương."], answer: 1 },
            { id: 51, topic: "Bài 3: Vai trò của Sử học", q: "Nội dung nào sau đây phản ánh đúng vai trò của công tác bảo tồn các di sản thiên nhiên?", options: ["A. Hình thành ý thức hướng về cội nguồn.", "B. Giúp duy trì kí ức và bản sắc cộng đồng.", "C. Góp phần giáo dục truyền thống yêu nước.", "D. Góp phần phát triển sự đa dạng sinh học."], answer: 3 },
            { id: 52, topic: "Bài 3: Vai trò của Sử học", q: "Một trong những di sản văn hóa phi vật thể tiêu biểu của Việt Nam là", options: ["A. Đờn ca tài tử Nam Bộ.", "B. Hoàng thành Thăng Long.", "C. Mộc bản triều Nguyễn.", "D. phố cổ Hội An."], answer: 0 },
            { id: 53, topic: "Bài 3: Vai trò của Sử học", q: "Bảo tồn và phát huy giá trị các di sản văn hoá là hoạt động", options: ["A. tìm kiếm, lưu giữ và bảo vệ các giá trị di sản.", "B. phát triển và lan toả các giá trị di sản.", "C. lưu giữ, bảo vệ và lan toả các giá trị của di sản.", "D. quy hoạch, lưu giữ và bảo vệ các di sản."], answer: 2 },
            { id: 54, topic: "Bài 3: Vai trò của Sử học", q: "Ngày 24 - 11 - 2005, Thủ tướng Chính phủ Việt Nam ra Quyết định số 36/2005/QĐ-TTg, lấy ngày 23 - 11 hàng năm là “Ngày Di sản Văn hóa Việt Nam” nhằm giáo dục và phát huy truyền thống nào sau đây của dân tộc ta?", options: ["A. Đoàn kết quyết tâm phấn đấu giữ vững những công trình văn hóa hiện đại.", "B. Trung thực, tự tôn dân tộc và ý thức trách nhiệm của công dân toàn cầu.", "C. Yêu nước, tự hào dân tộc, ý thức trách nhiệm trong việc bảo vệ di sản văn hóa.", "D. Phát huy sức mạnh đại đoàn kết dân tộc trong công tác tôn tạo di sản văn hóa."], answer: 2 },
            { id: 55, topic: "Bài 3: Vai trò của Sử học", q: "Lĩnh vực nào sau đây đóng vai trò quan trọng trực tiếp đối với sự phát triển của ngành công nghiệp văn hóa?", options: ["A. Thiên văn học.", "B. Y học.", "C. Sử học.", "D. Địa lí."], answer: 2 },
            { id: 56, topic: "Bài 3: Vai trò của Sử học", q: "Các di tích lịch sử - văn hóa của Việt Nam là một thế mạnh để phát triển", options: ["A. nông nghiệp bền vững.", "B. chế biến nông sản.", "C. du lịch.", "D. lâm nghiệp."], answer: 2 },
            { id: 57, topic: "Bài 3: Vai trò của Sử học", q: "Đọc đoạn tư liệu sau: \"Du lịch là một lĩnh vực tăng trưởng tiềm năng cho nền kinh tế châu Âu, tạo ra hơn 10% GDP của EU... Di sản độc đáo bao gồm: bảo tàng, nhà hát, di tích khảo cổ học và các thành phố lịch sử…đã khiến châu lục này trở thành điểm du lịch chính\". Nội dung chủ đạo đoạn tư liệu đề cập đến là", options: ["A. vai trò của lịch sử - văn hoá đối với sự phát triển của du lịch.", "B. tốc độ phát triển của ngành du lịch ở châu Âu trong tương lai.", "C. vai trò của du lịch đối với công tác bảo tồn các di sản văn hóa.", "D. vai trò của công tác bảo tồn các di sản văn hóa đối với du lịch."], answer: 0 },
            { id: 58, topic: "Bài 3: Vai trò của Sử học", q: "Điền từ còn thiếu vào vị trí (1) đến (5): Yếu tố hàng đầu của (1) chính là sức hấp dẫn của (2), bao gồm các yếu tố về (3), văn hoá truyền thống, (4), tín ngưỡng, (5)...", options: ["A. 1. D - 2. A - 3. E - 4. B - 5. C", "B. 1. A - 2. B - 3. C - 4. D - 5. E", "C. 1. E - 2. D - 3. C - 4. B - 5. A", "D. 1. B - 2. C - 3. A - 4. E - 5. D"], answer: 0 },
            { id: 59, topic: "Bài 3: Vai trò của Sử học", q: "Cung cấp bài học kinh nghiệm, hình thành ý tưởng để lên kế hoạch, xây dựng chiến lược phát triển ngành du lịch là một trong những vai trò của ngành nào dưới đây?", options: ["A. Lịch sử và văn hóa.", "B. Văn học và lịch sử.", "C. Khảo cổ và văn học", "D. Thiên văn và lịch sử."], answer: 0 },
            { id: 60, topic: "Bài 3: Vai trò của Sử học", q: "Đọc đoạn tư liệu về doanh thu du lịch Việt Nam từ 1990 đến 2019. Đoạn tư liệu nhấn mạnh vai trò của ngành nào đối với sự phát triển kinh tế đất nước?", options: ["A. Công nghiệp.", "B. Du lịch.", "C. Điện ảnh.", "D. Khai thác."], answer: 1 },
            { id: 61, topic: "Bài 3: Vai trò của Sử học", q: "Trong việc phát triển du lịch, yếu tố nào sau đây có vai trò đặc biệt quan trọng?", options: ["A. Kết quả hoạt động trong quá khứ của ngành du lịch.", "B. Hoạt động sản xuất của các nhà máy, xí nghiệp.", "C. Những giá trị về lịch sử, văn hoá truyền thống.", "D. Sự đổi mới, xây dựng lại các công trình di sản."], answer: 2 },
            { id: 62, topic: "Bài 3: Vai trò của Sử học", q: "Nội dung nào sao đây không phản ánh đúng vai trò của lịch sử - văn hóa đối với du lịch?", options: ["A. Là di sản, tài nguyên quý giá để phát triển du lịch.", "B. Tạo sức hấp dẫn to lớn để thu hút khách du lịch.", "C. Giúp con người hưởng thụ giá trị của di sản văn hóa.", "D. Là yếu tố quyết định duy nhất sự phát triển du lịch."], answer: 3 },
            { id: 63, topic: "Bài 3: Vai trò của Sử học", q: "Sự phát triển của du lịch có ý nghĩa nào sau đây đối với công tác bảo tồn di tích lịch sử - văn hóa?", options: ["A. định hướng sự phát triển của Sử học trong tương lai.", "B. Xác định chức năng, nhiệm vụ của khoa học lịch sử.", "C. cung cấp bài học kinh nghiệm cho các nhà sử học.", "D. quảng bá lịch sử, văn hoá cộng đồng ra bên ngoài."], answer: 3 },
            { id: 64, topic: "Bài 3: Vai trò của Sử học", q: "Nội dung nào sau đây không phản ánh đúng tác động của du lịch đối với công tác bảo tồn di tích lịch sử - văn hóa?", options: ["A. Góp phần quảng bá rộng rãi giá trị di tích lịch sử - văn hóa ra bên ngoài.", "B. Bồi đắp ý thức trách nhiệm bảo vệ di tích lịch sử - văn hóa của cộng đồng.", "C. Tạo ra nguồn kinh phí hỗ trợ công tác bảo tồn và phát huy giá trị các di sản.", "D. Ngăn cản tác động xấu của thiên nhiên và con người lên các di sản văn hóa."], answer: 3 },
            { id: 65, topic: "Bài 3: Vai trò của Sử học", q: "Theo Luật Du lịch Việt Nam năm 2010, địa danh nào sau đây ở không thuộc tài nguyên du lịch văn hóa?", options: ["A. Cố đô Huế.", "B. Thánh địa Mỹ Sơn.", "C. Vịnh Hạ Long.", "D. Dinh Độc Lập."], answer: 2 },
            { id: 66, topic: "Bài 3: Vai trò của Sử học", q: "Nội dung nào sao đây không phải là biện pháp để bảo tồn và phát huy giá trị di sản văn hóa?", options: ["A. Tăng cường tuyên truyền, phổ biến, giáo dục pháp luật.", "B. Nâng cao hiệu quả quản lý nhà nước về di sản văn hóa.", "C. Phát huy vai trò của cộng đồng trong bảo tồn di sản.", "D. Làm mới hoàn toàn các di sản văn hóa bị xuống cấp."], answer: 3 },

            { id: 163, topic: "Bài 5: Văn minh Phương Tây", q: "Nội dung nào sau đây không phản ánh đúng đặc điểm về tôn giáo của người Hy Lạp-La Mã cổ đại?", options: ["A. Tín ngưỡng thờ đa thần.", "B. Thường xuyên hiến tế.", "C. Chỉ thờ độc tôn một vị thần.", "D. Cầu nguyện và tổ chức lễ hội."], answer: 2 },
            { id: 164, topic: "Bài 5: Văn minh Phương Tây", q: "Vì sao nói chữ viết là cống hiến lớn lao của La Mã cổ đại?", options: ["A. Kí hiệu ít, đơn giản, dễ biểu đạt ý nghĩa sự vật, hiện tượng.", "B. Được tất cả các nước trên thế giới sử dụng đến ngày nay.", "C. Có hệ thống chữ cái hoàn chỉnh, cùng với hệ chữ số La Mã.", "D. Đơn giản, khoa học, khả năng ghép chữ linh hoạt, dễ phổ biến."], answer: 3 },
            { id: 165, topic: "Bài 5: Văn minh Phương Tây", q: "Nội dung nào sau đây không phản ánh đúng nguyên nhân xuất hiện của phong trào Văn hóa Phục hưng?", options: ["A. Giáo lí Giáo hội Cơ Đốc nặng những quan điểm lỗi thời.", "B. Tầng lớp tư sản mới ra đời chưa có địa vị xã hội tương ứng.", "C. Con người nhận thức về bản chất của thế giới xung quanh.", "D. Sự xuất hiện trào lưu Triết học Ánh sáng vào thế kỷ XVIII."], answer: 3 },
            { id: 166, topic: "Bài 5: Văn minh Phương Tây", q: "Đặc điểm nổi bật của quá trình hình thành và phát triển của triết học Hy Lạp - La Mã cổ đại là", options: ["A. cuộc đấu tranh giữa hai trường phái chủ nghĩa duy vật và duy tâm.", "B. quê hương của nhiều nhà triết học nổi tiếng của phương Tây.", "C. nền tảng cho nhiều thành tựu về tư tưởng, tri thức phương Tây.", "D. ra đời và phát triển trong bối cảnh các cuộc đấu tranh của nô lệ."], answer: 0 },
            { id: 167, topic: "Bài 5: Văn minh Phương Tây", q: "Ý nào sau đây không phản ánh đúng những nội dung cơ bản của phong trào văn hóa Phục hưng?", options: ["A. Lên án, đả kích Giáo hội Cơ Đốc và giai cấp thống trị phong kiến.", "B. Đòi quyền tự do cá nhân và đề cao giá trị con người, tinh thần dân tộc.", "C. Giải phóng con người khỏi trật tự, lễ giáo phong kiến thối nát.", "D. Đề cao nội dung và giáo lí Cơ Đốc giáo và tư tưởng phong kiến."], answer: 3 },
            { id: 168, topic: "Bài 5: Văn minh Phương Tây", q: "Nội dung nào sau đây không phản ánh đúng ý nghĩa của những thành tựu văn minh Tây Âu thời kì Phục hưng?", options: ["A. Đề cao giá trị con người và quyền tự do cá nhân, đề cao tinh thần dân tộc.", "B. Mở đường cho sự phát triển của văn minh Tây Âu trong những thế kỉ kế tiếp.", "C. Là cuộc đấu tranh công khai của giai cấp tư sản chống lại chế độ phong kiến.", "D. Góp phần củng cố và mở rộng ảnh hưởng của Giáo hội Cơ Đốc giáo."], answer: 3 },
            { id: 169, topic: "Bài 5: Văn minh Phương Tây", q: "Những tiến bộ trong cách tính lịch của người phương Tây so với phương Đông xuất phát từ", options: ["A. cách tính lịch dựa theo sự chuyển động của Mặt Trăng.", "B. việc đúc rút kinh nghiệm từ thực tiễn sản xuất.", "C. sự hiểu biết chính xác về Trái Đất và hệ Mặt Trời.", "D. việc tính lịch dựa theo sự chuyển động của Mặt Trời."], answer: 3 },
            { id: 170, topic: "Bài 5: Văn minh Phương Tây", q: "Người La Mã sớm có hiểu biết chính xác về Trái Đất và hệ Mặt Trời là nhờ", options: ["A. vào việc canh tác nông nghiệp.", "B. họ thường giao thương bằng đường biển.", "C. vào việc buôn bán giữa các thị quốc.", "D. sự phát triển của khoa học - kĩ thuật."], answer: 1 },
            { id: 171, topic: "Bài 5: Văn minh Phương Tây", q: "Những định lí, định đề đầu tiên có giá trị khái quát cao của toán học ra đời ở", options: ["A. Rôma.", "B. Hy Lạp.", "C. Trung Quốc.", "D. Ấn Độ."], answer: 1 },
            { id: 172, topic: "Bài 5: Văn minh Phương Tây", q: "Tại sao người Hi Lạp có hiểu biết chính xác hơn về Trái Đất và hệ Mặt Trời ?", options: ["A. Vì nhờ đi biển.", "B. Vì nhờ canh tách nông nghiệp.", "C. Nhờ sự buôn bán giữa các thị quốc.", "D. Nhờ khoa học - kỹ thuật phát triển."], answer: 0 },
            { id: 173, topic: "Bài 5: Văn minh Phương Tây", q: "Một trong những cống hiến lớn có giá trị đến nay của cư dân La Mã là", options: ["A. bảng chữ cái gồm 24 chữ.", "B. Đền Pác-tê-nông.", "C. giấy, thuốc súng, la bàn.", "D. Đấu trường La Mã."], answer: 0 },
            { id: 174, topic: "Bài 5: Văn minh Phương Tây", q: "Nhận xét nào không đúng về giá trị các công trình nghiên cứu của các nhà khoa học Hi Lạp, Rôma thời cổ đại?", options: ["A. Những hiểu biết đó là sự kế thừa và phát triển các thành tựu văn hóa của người phương Đông cổ đại.", "B. Đây là những công trình khoa học lớn, còn có giá trị tới ngày nay.", "C. Các công trình không dừng lại ở việc ghi chép và giá trị mà nâng lên tầm khái quát hóa, trừu tượng hóa cao.", "D. Tạo nền tảng cho các phát minh kinh tế thời cổ đại."], answer: 3 },
            { id: 175, topic: "Bài 5: Văn minh Phương Tây", q: "Năm 776 TCN, tại đền thờ thần Dớt ở Ô-lim-pi-a (Hy Lạp) đã diễn ra sự kiện nào sau đây?", options: ["A. Chính quyền La Mã chính thức công nhận Cơ Đốc giáo.", "B. Các cuộc đấu tranh của nô lệ và dân nghèo bùng nổ.", "C. Đại hội thể thao Pa-na-thê-nai-a tại A- ten.", "D. Đại hội Ô-lim-píc đầu tiên được tổ chức."], answer: 3 },
            { id: 176, topic: "Bài 5: Văn minh Phương Tây", q: "Một số định lí của nhà toán học nào từ thời cổ đại vẫn còn rất phổ biến đến ngày nay?", options: ["A. Talet, Pitago, Ơclit.", "B. Pitago, Hipôcrat.", "C. Talet, Hôme.", "D. Hôme, Hêrôdốt."], answer: 0 },
            { id: 177, topic: "Bài 5: Văn minh Phương Tây", q: "Những công trình kiến trúc của quốc gia cổ đại nào đạt đến đỉnh cao của nghệ thuật nhưng vẫn rất gần gũi với cuộc sống?", options: ["A. Các đền thờ ở Hi lạp.", "B. Đền đài, đấu trường ở Rôma.", "C. Các kim tự tháp ở Ai Cập.", "D. Các thành quách ở Trung Quốc."], answer: 0 },
            { id: 178, topic: "Bài 5: Văn minh Phương Tây", q: "Phong trào văn hóa Phục hưng được đánh giá là một “Cuộc cách mạng tiến bộ vĩ đại” vì lí do nào sau đây?", options: ["A. Là cuộc đấu tranh công khai đầu tiên của tư sản chống phong kiến.", "B. Mở ra những vùng đất mới, con đường mới và những dân tộc mới.", "C. Thị trường thế giới mở rộng, thúc đẩy hàng hải quốc tế phát triển.", "D. Thúc đẩy quá trình khủng hoảng của chủ nghĩa tư bản ở châu Âu."], answer: 0 },
            { id: 179, topic: "Bài 5: Văn minh Phương Tây", q: "Phong trào văn hóa Phục hưng được đánh giá là", options: ["A. một cuộc cách mạng của tầng lớp quý tộc và tăng lữ.", "B. cuộc đấu tranh của tầng lớp quý tộc chống lại tư sản.", "C. bước tiến kì diệu của văn minh phương Tây.", "D. bước tiến thần kì của văn minh phương Đông."], answer: 2 },
            { id: 180, topic: "Bài 5: Văn minh Phương Tây", q: "Hệ thống chữ cái Tiếng Việt (chữ Quốc ngữ) thuộc", options: ["A. chữ tượng hình.", "B. chữ tượng ý.", "C. chữ La-tinh.", "D. chữ Việt cổ."], answer: 2 }
        ];

        function QuizApp() {
            const [questions, setQuestions] = useState(originalQuestions);
            const [answers, setAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const [selectedTopic, setSelectedTopic] = useState("Tất cả");

            // Chọn phương án trả lời
            const handleSelect = (qId, optionIdx) => {
                if (submitted) return;
                setAnswers(prev => ({ ...prev, [qId]: optionIdx }));
            };

            // Lọc câu hỏi theo bài/chủ đề
            const filteredQuestions = selectedTopic === "Tất cả"
                ? questions
                : questions.filter(q => q.topic.includes(selectedTopic));

            // Tính điểm
            const score = Object.keys(answers).reduce((acc, qId) => {
                const q = questions.find(item => item.id === parseInt(qId));
                return q && answers[qId] === q.answer ? acc + 1 : acc;
            }, 0);

            // Nút Làm Lại
            const handleReset = () => {
                setAnswers({});
                setSubmitted(false);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // Nút Xáo Trộn Vị Trí Câu Hỏi & Phương Án A, B, C, D
            const handleShuffle = () => {
                const shuffledQs = [...originalQuestions].map(q => {
                    const originalAnsText = q.options[q.answer];
                    // Tạo mảng mới các lựa chọn đã được đảo
                    const shuffledOpts = [...q.options].sort(() => Math.random() - 0.5);
                    // Tìm vị trí mới của đáp án đúng
                    const newAnsIdx = shuffledOpts.indexOf(originalAnsText);
                    return {
                        ...q,
                        options: shuffledOpts,
                        answer: newAnsIdx
                    };
                }).sort(() => Math.random() - 0.5);

                setQuestions(shuffledQs);
                handleReset();
            };

            return (
                <div class="min-h-screen bg-slate-100 text-slate-800 pb-12">
                    {/* Thanh tiêu đề */}
                    <header class="sticky top-0 z-30 bg-indigo-700 text-white shadow-lg">
                        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-2">
                            <div>
                                <h1 class="text-xl sm:text-2xl font-black">ÔN THI LỊCH SỬ 10 - GIỮA HK1</h1>
                                <p class="text-xs text-indigo-200">Hệ thống trắc nghiệm tương tác 180 câu chuẩn tài liệu</p>
                            </div>
                            <div class="bg-indigo-800 px-4 py-2 rounded-xl text-center">
                                <span class="text-xs uppercase font-bold text-indigo-300 block">Tổng số câu</span>
                                <span class="text-lg font-extrabold text-amber-300">{questions.length} Câu</span>
                            </div>
                        </div>
                    </header>

                    {/* Khung điều khiển & Tiến độ */}
                    <main class="max-w-5xl mx-auto px-4 mt-6 space-y-6">
                        <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
                            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                                <div class="w-full md:w-1/3">
                                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Chọn chủ đề ôn tập:</label>
                                    <select 
                                        value={selectedTopic} 
                                        onChange={(e) => setSelectedTopic(e.target.value)}
                                        class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    >
                                        <option value="Tất cả">Tất cả bài học (180 câu)</option>
                                        <option value="Chủ đề 1">Chủ đề 1: Lịch sử và Sử học (35 câu)</option>
                                        <option value="Bài 3">Bài 3: Vai trò của Sử học (31 câu)</option>
                                        <option value="Bài 4">Bài 4: Văn minh Phương Đông (74 câu)</option>
                                        <option value="Bài 5">Bài 5: Văn minh Phương Tây (40 câu)</option>
                                    </select>
                                </div>

                                <div class="w-full md:w-1/3 text-center">
                                    <div class="text-xs font-bold text-slate-500 mb-1">
                                        Đã làm: <span class="text-indigo-600">{Object.keys(answers).length}</span> / {questions.length} câu
                                    </div>
                                    <div class="w-full bg-slate-200 h-3 rounded-full overflow-hidden">
                                        <div 
                                            class="bg-indigo-600 h-full transition-all duration-300"
                                            style={{ width: `${(Object.keys(answers).length / questions.length) * 100}%` }}
                                        ></div>
                                    </div>
                                </div>

                                <div class="flex flex-wrap gap-2 w-full md:w-auto justify-end">
                                    <button onClick={handleShuffle} class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold text-sm rounded-xl shadow transition">
                                        🔀 Xáo trộn câu hỏi
                                    </button>
                                    <button onClick={handleReset} class="px-4 py-2 bg-slate-600 hover:bg-slate-700 text-white font-bold text-sm rounded-xl shadow transition">
                                        🔄 Làm lại
                                    </button>
                                    <button onClick={() => setSubmitted(true)} class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl shadow-md transition">
                                        📝 Nộp bài
                                    </button>
                                </div>
                            </div>

                            {/* Kết quả sau khi nộp bài */}
                            {submitted && (
                                <div class="mt-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-center">
                                    <h2 class="text-xl font-black text-emerald-800">
                                        KẾT QUẢ: {score} / {questions.length} CÂU ĐÚNG ({((score / questions.length) * 100).toFixed(1)}%)
                                    </h2>
                                    <p class="text-sm text-emerald-600 mt-1">
                                        Những câu sai được <span class="text-red-600 font-bold">tô màu đỏ</span> và đi kèm đáp án chuẩn màu xanh lá cây bên dưới.
                                    </p>
                                </div>
                            )}
                        </div>

                        {/* Danh sách câu hỏi */}
                        <div class="space-y-4">
                            {filteredQuestions.map((q, index) => {
                                const selectedOpt = answers[q.id];
                                const isAnswered = selectedOpt !== undefined;
                                const isWrong = submitted && isAnswered && selectedOpt !== q.answer;

                                return (
                                    <div 
                                        key={q.id} 
                                        class={`p-6 rounded-2xl bg-white border-2 shadow-sm transition ${
                                            submitted 
                                                ? (selectedOpt === q.answer ? 'border-green-400 bg-green-50/20' : (isAnswered ? 'border-red-400 bg-red-50/20' : 'border-slate-200'))
                                                : 'border-slate-200 hover:border-indigo-300'
                                        }`}
                                    >
                                        <div class="flex items-center justify-between gap-2 mb-3">
                                            <span class="px-3 py-1 bg-indigo-100 text-indigo-800 font-black text-xs rounded-lg">
                                                Câu {index + 1}
                                            </span>
                                            <span class="text-xs font-semibold text-slate-400">
                                                {q.topic}
                                            </span>
                                        </div>

                                        <h3 class="text-base sm:text-lg font-bold text-slate-800 mb-4">
                                            {q.q}
                                        </h3>

                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            {q.options.map((opt, optIdx) => {
                                                let btnClass = "border-slate-200 bg-slate-50 text-slate-700 hover:bg-indigo-50 hover:border-indigo-300";

                                                if (selectedOpt === optIdx) {
                                                    btnClass = "border-indigo-600 bg-indigo-50 text-indigo-900 font-bold shadow-sm";
                                                }

                                                if (submitted) {
                                                    if (optIdx === q.answer) {
                                                        // Câu đúng tô màu xanh lá
                                                        btnClass = "border-green-600 bg-green-500 text-white font-bold shadow";
                                                    } else if (selectedOpt === optIdx) {
                                                        // Câu làm sai tô màu đỏ
                                                        btnClass = "border-red-600 bg-red-500 text-white font-bold shadow";
                                                    } else {
                                                        btnClass = "border-slate-200 bg-slate-100 text-slate-400 opacity-60";
                                                    }
                                                }

                                                return (
                                                    <button
                                                        key={optIdx}
                                                        onClick={() => handleSelect(q.id, optIdx)}
                                                        disabled={submitted}
                                                        class={`p-3.5 rounded-xl border-2 text-left text-sm transition flex items-start ${btnClass}`}
                                                    >
                                                        {opt}
                                                    </button>
                                                );
                                            })}
                                        </div>

                                        {/* Hiển thị đáp án đúng nếu trả lời sai */}
                                        {submitted && isWrong && (
                                            <div class="mt-4 p-3 bg-red-100 border border-red-300 rounded-xl text-xs text-red-800 font-semibold flex items-center gap-2">
                                                <span>❌ Bạn đã chọn sai! Đáp án đúng chuẩn là:</span>
                                                <span class="bg-green-600 text-white px-2 py-0.5 rounded font-bold">{q.options[q.answer]}</span>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<QuizApp />);
    </script>
</body>
</html>
